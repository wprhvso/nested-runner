[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nested-runner"
version = "0.1.2"
description = "Self-hosted раннеры GitHub Actions внутри GitHub Actions"
readme = "README.md"
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/wprhvso/nested-runner"

[tool.hatch.build.targets.wheel]
packages = ["nested_runner"]

[tool.hatch.build.targets.sdist]
include = ["nested_runner", "keys", "README.md", "VERSION"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D",
    "ANN401",
    "COM812",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "INP001",
    "PLR0917",
    "RUF001",
    "S311",
    "S603",
    "S607",
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"nested_runner/http.py" = ["ANN401"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
include = ["nested_runner"]
pythonVersion = "3.13"
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
