[project]
name = "nested-runner"
version = "0.1.0"
description = "Ephemeral GitHub Actions runners running inside GitHub Actions"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "typer>=0.27",
    "pydantic>=2.13",
    "platformdirs>=4.11",
    "rich>=15.0",
    "tenacity>=9.1",
]

[project.scripts]
nested-runner = "nested_runner.cli:app"

[dependency-groups]
dev = ["basedpyright>=1.39", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "D100",
    "D104",
    "D105",
    "D107",
    "RUF001",
    "RUF002",
    "RUF003",
    "TC001",
    "TC003",
    "EM101",
    "EM102",
    "TRY003",
    "FBT001",
    "FBT002",
    "ANN401",
    "PLR2004",
    "CPY001",
]

[tool.basedpyright]
include = ["nested_runner"]
typeCheckingMode = "recommended"
reportMissingTypeStubs = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
