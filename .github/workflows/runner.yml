name: runner
run-name: nested ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      jit:
        description: age-encrypted JIT config
        required: true
        type: string

permissions: {}

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NESTED_DIR: ${{ github.workspace }}/nested

    steps:
      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Resolve runner version
        id: version
        run: |
          set -euo pipefail
          version="$(curl -fsSL --retry 3 --retry-all-errors \
            https://api.github.com/repos/actions/runner/releases/latest \
            | jq -r '.tag_name' | tr -d v)"
          [ -n "$version" ] || { echo "не определил версию раннера" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore runner
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nested-runner
          key: runner-linux-x64-${{ steps.version.outputs.value }}

      - name: Download runner
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/nested-runner
          curl -fsSL --retry 3 --retry-all-errors -o ~/.cache/nested-runner/runner.tar.gz \
            "https://github.com/actions/runner/releases/download/v${VERSION}/actions-runner-linux-x64-${VERSION}.tar.gz"

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p "$NESTED_DIR" /home/runner/work/_temp/_work
          tar xzf ~/.cache/nested-runner/runner.tar.gz -C "$NESTED_DIR"

      - name: Decrypt JIT config
        id: jit
        env:
          NESTED_KEY: ${{ secrets.NESTED_KEY }}
          CIPHERTEXT: ${{ inputs.jit }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT

          printf '%s' "$NESTED_KEY" > "$keyfile"
          jit="$(printf '%s' "$CIPHERTEXT" | age -d -i "$keyfile")"

          [ -n "$jit" ] || { echo "пустой JIT-конфиг после расшифровки" >&2; exit 1; }
          echo "::add-mask::$jit"
          echo "value=$jit" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          ACTIONS_RUNNER_INPUT_JITCONFIG: ${{ steps.jit.outputs.value }}
        run: cd "$NESTED_DIR" && ./run.sh
