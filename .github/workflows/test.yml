name: test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    # Имя scale set, не метка. Должно совпадать с NESTED_SCALE_SET.
    runs-on: nested
    timeout-minutes: 5

    steps:
      - name: Where am I
        run: |
          echo "runner:   ${RUNNER_NAME}"
          echo "os:       ${RUNNER_OS}"
          echo "workdir:  ${PWD}"
          uname -a

      - name: Do something
        run: |
          echo "matryoshka works"
          sleep 5
